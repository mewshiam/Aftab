name: aftab_media
description: آفتاب مدیا — Persian-first cross-platform media app (Android, Android TV, Windows).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # FFI primitives (Utf8 encode/decode helpers).
  ffi: ^2.1.0
  # libmpv playback, on every supported platform.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.17
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_windows_video: ^1.0.9
  # Where the store file and downloads live.
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
