name: aftab_media
description: آفتاب مدیا — Persian-first cross-platform media app (Android, Android TV, Windows).
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Localization machinery (fa-IR + en-US), pins the matching intl.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  # FFI primitives (Utf8 encode/decode helpers).
  ffi: ^2.1.0
  # libmpv playback, on every supported platform.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.17
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_windows_video: ^1.0.9
  # Where the store file, image cache and downloads live.
  path_provider: ^2.1.3
  path: ^1.9.0
  # Artwork fetches for the image cache.
  http: ^1.2.2
  # Material You dynamic colors (Android 12+; harmless elsewhere).
  dynamic_color: ^1.7.0
  # Brightness gesture in the player (Android + Windows).
  screen_brightness: ^2.1.11
  # External subtitle file picking in the player.
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/fonts/OFL.txt
    # Vazirmatn is also staged for libass (subtitle rendering):
    # media_kit copies it into fontconfig's dir on Android, and the
    # player stages it into the app-support dir on Windows.
    - assets/fonts/
  fonts:
    # Persian-first typeface (OFL) — covers both the Arabic script and
    # Latin well, so one family keeps fa/en typography consistent.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
